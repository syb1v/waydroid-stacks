[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waydroid-stacks"
version = "0.1.0"
description = "BlueStacks-подобный интерфейс для Waydroid: библиотека приложений, встроенный игровой движок, кеймаппер"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "syb1v"}]
requires-python = ">=3.10"
dependencies = [
    "pyaxmlparser>=0.3.28",
]

[project.scripts]
waydroid-stacks = "waydroid_stacks.__main__:main"

[tool.setuptools.packages.find]
include = ["waydroid_stacks*"]

[tool.setuptools.package-data]
"*" = ["*.svg", "*.css"]
