[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waydroid-stacks"
dynamic = ["version"]
description = "BlueStacks-подобная оболочка для Waydroid: библиотека приложений, встроенный игровой режим, кеймаппер"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "syb1v"}]
requires-python = ">=3.10"
dependencies = [
    "pyaxmlparser>=0.3.28",
]

[tool.setuptools.dynamic]
version = {attr = "waydroid_stacks.__version__"}

[project.scripts]
waydroid-stacks = "waydroid_stacks.__main__:main"

[tool.setuptools.packages.find]
include = ["waydroid_stacks*"]

[tool.setuptools.package-data]
"*" = ["*.svg", "*.css"]
