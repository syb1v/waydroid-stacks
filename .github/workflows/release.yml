name: Release

# Сборка и публикация релиза: deb, rpm, AppImage, исходники, AUR.
#
# Обычный релиз: push тега vX.Y.Z.
# Проверка сборки без публикации: Actions → Release → Run workflow
#   tag: master  (или любой тег), dry_run: true
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег или ветка для сборки (например v0.3.0 или master)"
        required: true
        default: master
      dry_run:
        description: "Собрать артефакты без релиза и AUR"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  source:
    name: Исходники (tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Сборка tarball
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' waydroid_stacks/__init__.py)"
          git archive --format=tar.gz \
            --prefix="waydroid-stacks-$VERSION/" \
            -o "waydroid-stacks-$VERSION.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: waydroid-stacks-*.tar.gz
          if-no-files-found: error

  deb:
    name: Debian/Ubuntu (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Сборка .deb
        run: ./packaging/deb/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  rpm:
    name: Fedora/RHEL (.rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Установка rpmbuild
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm
      - name: Сборка .rpm
        run: ./packaging/rpm/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  appimage:
    name: AppImage (автономный)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Зависимости сборки AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-pip patchelf desktop-file-utils zsync file e2fsprogs \
            libfuse2t64 squashfs-tools fakeroot binutils \
            libgdk-pixbuf2.0-bin libglib2.0-bin gtk-update-icon-cache \
            gstreamer1.0-tools shared-mime-info
          pip install --break-system-packages --quiet appimage-builder
          sudo ln -sf /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders \
            /usr/local/bin/gdk-pixbuf-query-loaders
      - name: Сборка AppImage
        run: ./packaging/appimage/build.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    if: ${{ !inputs.dry_run }}
    needs: [source, deb, rpm, appimage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Контрольные суммы
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Заметки из CHANGELOG
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' waydroid_stacks/__init__.py)"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S)
          body = m.group(1).strip() if m else "См. CHANGELOG.md"
          open("release-notes.md", "w", encoding="utf-8").write(body + "\n")
          PY
          cat release-notes.md

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* \
              --title "Waydroid Stacks $TAG" \
              --notes-file release-notes.md
          fi

  aur:
    name: AUR (Arch Linux)
    if: ${{ !inputs.dry_run }}
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Проверить наличие ключа AUR
        id: key
        run: |
          if [ -n "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет AUR_SSH_PRIVATE_KEY не задан — публикация в AUR пропущена"
          fi

      - name: Настроить SSH
        if: steps.key.outputs.have == '1'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Обновить PKGBUILD и опубликовать в AUR
        if: steps.key.outputs.have == '1'
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' waydroid_stacks/__init__.py)"
          REF="$TAG"
          git config --global user.name "${AUR_USERNAME:-syb1v}"
          git config --global user.email "${AUR_EMAIL:-108201690+syb1v@users.noreply.github.com}"

          # Клонируем пакет (для нового AUR вернёт пустой репозиторий)
          if ! git clone ssh://aur@aur.archlinux.org/waydroid-stacks.git aur-repo 2>/dev/null; then
            mkdir -p aur-repo
            git -C aur-repo init -b master
            git -C aur-repo remote add origin ssh://aur@aur.archlinux.org/waydroid-stacks.git
          fi

          # PKGBUILD: версия + sha256 релизного tarball
          URL="https://github.com/syb1v/waydroid-stacks/releases/download/$REF/waydroid-stacks-$VERSION.tar.gz"
          curl -fsSL "$URL" -o /tmp/src.tar.gz
          SHA="$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)"
          sed -e "s|^pkgver=.*|pkgver=$VERSION|" \
              -e "s|^source=.*|source=(\"waydroid-stacks-\$pkgver.tar.gz::$URL\")|" \
              -e "s|^sha256sums=.*|sha256sums=('$SHA')|" \
              packaging/aur/PKGBUILD > aur-repo/PKGBUILD
          cp LICENSE aur-repo/LICENSE

          # .SRCINFO генерируем в контейнере Arch (makepkg не любит root)
          docker run --rm \
            -v "$PWD/aur-repo/PKGBUILD:/src/PKGBUILD:ro" \
            archlinux:latest bash -c '
              useradd -m builder >/dev/null 2>&1 || true
              mkdir -p /tmp/work && cp /src/PKGBUILD /tmp/work/
              chown -R builder /tmp/work
              su builder -c "cd /tmp/work && makepkg --printsrcinfo"
            ' > aur-repo/.SRCINFO
          head -5 aur-repo/.SRCINFO

          # Коммит и публикация
          cd aur-repo
          git add PKGBUILD .SRCINFO LICENSE
          git diff-index --quiet HEAD || git commit -m "Update to $REF"
          git push origin master
